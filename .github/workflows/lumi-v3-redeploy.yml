name: LUMI v3 one-time redeploy

on:
  schedule:
    - cron: '5 9 21 8 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-vercel-git-deploy:
    if: github.event_name == 'workflow_dispatch' || github.run_started_at >= '2026-08-21T09:00:00Z' && github.run_started_at < '2026-08-22T00:00:00Z'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trigger one-time production rebuild
        run: |
          git config user.name "LUMI Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          printf 'LUMI v3 production redeploy trigger: %s\n' "$(date -u +%FT%TZ)" > .vercel-redeploy-trigger
          git rm .github/workflows/lumi-v3-redeploy.yml
          git add .vercel-redeploy-trigger
          git commit -m "Trigger LUMI v3 production deployment after quota reset"
          git push origin HEAD:main
