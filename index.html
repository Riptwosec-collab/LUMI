<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B1020"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><title>LUMI AI</title><style>html,body{margin:0;background:#0B1020;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#boot{min-height:100dvh;display:grid;place-items:center;text-align:center}.l{font-size:32px;font-weight:900;letter-spacing:.15em;background:linear-gradient(90deg,#38BDF8,#8B5CF6,#FB7185);-webkit-background-clip:text;color:transparent}.s{margin-top:10px;color:#A8B3CF;font-size:12px}</style></head><body><div id="boot"><div><div class="l">LUMI AI</div><div class="s">Loading Premium AI Studio…</div></div></div><script>(async()=>{try{const parts=await Promise.all(['./ui1.txt','./ui2.txt'].map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(x);return r.text()})));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('.s').textContent='Unable to load LUMI AI: '+e.message}})()</script></body></html>
